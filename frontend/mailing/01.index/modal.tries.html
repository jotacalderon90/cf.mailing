
  <!-- Modal para notificar -->
  <div class="modal fade" 
    id="mdTries" 
    tabindex="-1" 
    aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
				<div class="modal-header border-0 pb-0" :class="modal.data.notify.type === 'error' ? 'bg-danger text-white' : 'bg-success text-white'">
					<h5 class="modal-title d-flex align-items-center">
						<i :class="modal.data.notify.type === 'error' ? 'fa fa-exclamation-circle' : 'fa fa-check-circle'" class="me-2"></i>
						Registros de intentos
					</h5>
					<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body pt-2 table-responsive">
          
          <table class="table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Respuesta</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="row in mailing.tries">
                <td>{{row.created_formatted}}</td>
                <td>{{row.response}}</td>
              </tr>
            </tbody>
          </table>
          
				</div>
        <div class="modal-footer border-0 pt-0">
					<button type="button" class="btn btn-sm btn-light" data-bs-dismiss="modal">
            Cerrar
          </button>
				</div>
			</div>
		</div>
	</div>
