
services:

  mailing:
    build:
      context: .
      target: prod
    image: mailing:0.0.1
    container_name: mailing
    restart: unless-stopped
    mem_limit: 128M
    mem_reservation: 64M
    env_file:
      - .env.production
    volumes:
      - /var/log/trascender/mailing:/srv/cf.mailing/logs
    environment:
      NODE_ENV: "production"
      PORT: 2205
    ports:
      - "127.0.0.1:2205:2205"